<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradiente do fundo em azul-marinho profundo -->
    <linearGradient id="readksNavyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E172A" />
      <stop offset="100%" stop-color="#14213D" />
    </linearGradient>

    <!-- Gradiente suave da página esquerda -->
    <linearGradient id="leftPageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F4EFE6" />
    </linearGradient>

    <!-- Gradiente suave da página direita -->
    <linearGradient id="rightPageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4EFE6" />
      <stop offset="100%" stop-color="#E7E0D3" />
    </linearGradient>

    <!-- Sombra suave das páginas -->
    <filter id="pageShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#050914" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Fundo com cantos arredondados padrão squircle -->
  <rect width="512" height="512" rx="112" fill="url(#readksNavyBg)" />

  <!-- Borda sutil de luxo editorial -->
  <rect x="28" y="28" width="456" height="456" rx="92" fill="none" stroke="#25385E" stroke-width="4" stroke-opacity="0.6" />

  <!-- Ilustração do Livro Aberto Centralizado -->
  <g filter="url(#pageShadow)" transform="translate(64, 96)">
    <!-- Base / Capa inferior visível nas bordas -->
    <path d="M192 284 C116 262 48 266 0 282 L0 94 C48 78 116 74 192 96 C268 74 336 78 384 94 L384 282 C336 266 268 262 192 284 Z" fill="#0A0F1D" opacity="0.3" />

    <!-- Página Esquerda em Tom Marfim Acolhedor -->
    <path d="M192 270 C120 248 50 252 8 266 L8 88 C50 74 120 70 192 92 Z" fill="url(#leftPageGrad)" />

    <!-- Página Direita com curvatura elegante -->
    <path d="M192 270 C264 248 334 252 376 266 L376 88 C334 74 264 70 192 92 Z" fill="url(#rightPageGrad)" />

    <!-- Lombada Central / Costura do livro -->
    <line x1="192" y1="92" x2="192" y2="270" stroke="#10192D" stroke-width="5" stroke-linecap="round" />

    <!-- Marcador de Leitura (Fita Terracotta Acolhedora) -->
    <path d="M182 86 H202 V196 L192 184 L182 196 Z" fill="#C06338" />
  </g>
</svg>
